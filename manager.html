<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Monochrome | Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      color: #1a1a1a;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .header {
      background: #ffffff;
      border-bottom: 2px solid #c9a96e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    }
    .logo h2 {
      font-weight: 300;
      letter-spacing: 3px;
      font-family: 'Georgia', serif;
    }
    .logo h2 span { color: #c9a96e; }
    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .back-btn {
      background: transparent;
      border: 1px solid #d4d4d4;
      padding: 0.4rem 1.2rem;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 0.7rem;
      letter-spacing: 1px;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    .back-btn:hover {
      background: #1a1a1a;
      color: white;
      border-color: #1a1a1a;
    }
    .logout-btn {
      background: #c9a96e;
      border: none;
      color: white;
      padding: 0.4rem 1.2rem;
      cursor: pointer;
      font-size: 0.7rem;
      letter-spacing: 1px;
      font-family: 'Georgia', serif;
      transition: all 0.3s;
    }
    .logout-btn:hover {
      background: #1a1a1a;
    }
    .lang-selector {
      display: flex;
      gap: 0.2rem;
      background: #f8f6f1;
      padding: 0.2rem;
      border: 1px solid #e0d6c8;
    }
    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.6rem;
      font-weight: 500;
      color: #888;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    .lang-btn.active {
      background: #c9a96e;
      color: white;
    }
    .lang-btn:hover:not(.active) { color: #1a1a1a; }

    .sync-status {
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border-radius: 0;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .sync-status.synced { color: #2a7a4a; }
    .sync-status.syncing { color: #c9a96e; }
    .sync-status.error { color: #c0392b; }

    .password-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-overlay.hidden { display: none; }
    .password-box {
      background: white;
      padding: 3rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 2px solid #c9a96e;
    }
    .password-box h2 {
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
      font-family: 'Georgia', serif;
    }
    .password-box p {
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      font-family: 'Georgia', serif;
    }
    .password-box input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #d4d4d4;
      font-size: 1rem;
      margin-bottom: 1rem;
      font-family: 'Georgia', serif;
      text-align: center;
      letter-spacing: 4px;
    }
    .password-box button {
      width: 100%;
      padding: 0.8rem;
      background: #1a1a1a;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 2px;
      font-family: 'Georgia', serif;
      transition: all 0.3s;
    }
    .password-box button:hover {
      background: #c9a96e;
    }
    .password-box .error {
      color: #c0392b;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    .password-box .error.show { display: block; }

    .container {
      max-width: 1400px;
      margin: 1.5rem auto;
      padding: 0 2rem;
    }

    .today-hero {
      background: #ffffff;
      border: 2px solid #c9a96e;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 30px rgba(201,169,110,0.15);
    }
    .today-hero .hero-item .hero-value {
      font-size: 2.4rem;
      font-weight: 300;
      color: #c9a96e;
      font-family: 'Georgia', serif;
    }
    .today-hero .hero-item .hero-label {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 0.2rem;
      font-family: 'Georgia', serif;
    }
    .today-hero .hero-item .hero-sub {
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 0.1rem;
    }
    .today-hero .hero-item.profit .hero-value { color: #2a7a4a; }
    .today-hero .hero-item.loss .hero-value { color: #a04030; }

    .tabs {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e8e0d6;
      padding-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 1px;
      font-family: 'Georgia', serif;
      transition: all 0.3s;
      color: #888;
    }
    .tab-btn:hover { color: #1a1a1a; }
    .tab-btn.active {
      background: #1a1a1a;
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid #e8e0d6;
      padding: 1.2rem;
      text-align: center;
    }
    .stat-card .value {
      font-size: 1.8rem;
      font-weight: 300;
      color: #c9a96e;
      font-family: 'Georgia', serif;
    }
    .stat-card .label {
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.3rem;
      font-family: 'Georgia', serif;
    }
    .stat-card.gold .value { color: #c9a96e; }
    .stat-card.green .value { color: #2a7a4a; }
    .stat-card.red .value { color: #a04030; }

    .date-selector {
      background: #ffffff;
      border: 1px solid #e8e0d6;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .date-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .date-group label {
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Georgia', serif;
    }
    .date-group input, .date-group select {
      padding: 0.5rem;
      border: 1px solid #d4d4d4;
      background: white;
      font-size: 0.8rem;
      font-family: 'Georgia', serif;
    }
    .date-group button {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      letter-spacing: 1px;
      font-family: 'Georgia', serif;
      transition: all 0.3s;
    }
    .date-group button:hover {
      background: #c9a96e;
    }

    .table-container {
      background: #ffffff;
      border: 1px solid #e8e0d6;
      overflow-x: auto;
      margin: 1rem 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Georgia', serif;
    }
    th, td {
      padding: 0.8rem 1rem;
      text-align: left;
      border-bottom: 1px solid #f0ebe4;
      font-size: 0.8rem;
    }
    th {
      background: #faf8f5;
      font-weight: 500;
      color: #666;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.65rem;
    }
    tr:hover { background: #faf8f5; }
    .total-row {
      background: #f5f0ea !important;
      font-weight: 600;
    }
    .total-row td { border-top: 2px solid #c9a96e; }

    .status-badge {
      display: inline-block;
      padding: 0.1rem 0.6rem;
      font-size: 0.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-badge.paid { background: #e0f0e0; color: #2a6b2a; }
    .status-badge.pending { background: #f5e6d3; color: #a86f1a; }
    .status-badge.completed { background: #e8e8e8; color: #666; }

    .chart-container {
      background: #ffffff;
      border: 1px solid #e8e0d6;
      padding: 1.5rem;
      margin: 1rem 0;
    }
    .chart-container canvas {
      max-height: 300px;
      width: 100% !important;
    }

    .expense-form {
      background: #ffffff;
      border: 1px solid #e8e0d6;
      padding: 1.5rem;
      margin: 1rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .expense-form .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 150px;
    }
    .expense-form .field label {
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Georgia', serif;
    }
    .expense-form .field input, 
    .expense-form .field select,
    .expense-form .field textarea {
      padding: 0.5rem;
      border: 1px solid #d4d4d4;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      background: white;
    }
    .expense-form .field textarea { resize: vertical; min-height: 40px; }
    .expense-form button {
      background: #c9a96e;
      color: white;
      border: none;
      padding: 0.5rem 2rem;
      cursor: pointer;
      font-size: 0.7rem;
      letter-spacing: 1px;
      font-family: 'Georgia', serif;
      transition: all 0.3s;
      height: 40px;
      align-self: flex-end;
    }
    .expense-form button:hover { background: #1a1a1a; }

    @media (max-width: 768px) {
      .container { padding: 0 1rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .date-selector { flex-direction: column; align-items: stretch; }
      .expense-form { flex-direction: column; }
      .expense-form .field { min-width: 100%; }
      .today-hero { grid-template-columns: 1fr 1fr; padding: 1rem; }
      .today-hero .hero-item .hero-value { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="password-overlay" id="passwordOverlay">
  <div class="password-box">
    <h2 id="loginTitle">🔐 THE MONOCHROME</h2>

<div class="container" id="mainContent" style="display:none;">

  <div id="overviewTab" class="tab-content active">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1rem;">

<script>
  // ==================== JSONBIN.IO CONFIG ====================
  const JSONBIN_BIN_ID = "6a6a071bf5f4af5e29d16d67";
  const JSONBIN_MASTER_KEY = "$2a$10$.oOBTbpOsTKbbBf6qQOuruZnI2o3Z0yJq88kx4EO9blC/5e1.rsSe";

  // ==================== JSONBIN.IO FUNCTIONS ====================
  function setSyncStatus(status, message) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    if (status === 'synced') {
      el.className = 'sync-status synced';
      el.textContent = '● ' + (message || 'synced');
    } else if (status === 'syncing') {
      el.className = 'sync-status syncing';
      el.textContent = '⟳ ' + (message || 'syncing...');
    } else {
      el.className = 'sync-status error';
      el.textContent = '✕ ' + (message || 'error');
    }
  }

  async function loadFromJSONBin() {
    try {
      setSyncStatus('syncing', 'loading...');
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        headers: {
          'X-Master-Key': JSONBIN_MASTER_KEY
        }
      });
      
      if (!response.ok) {
        const errorText = await response.text();
        console.error('Load error:', errorText);
        throw new Error(`Status ${response.status}: ${errorText}`);
      }
      
      const data = await response.json();
      const record = data.record;
      
      if (record && typeof record === 'object') {
        setSyncStatus('synced', 'loaded ✅');
        return record;
      }
      
      return { orders: [], expenses: [] };
    } catch (error) {
      console.error('Load error:', error);
      setSyncStatus('error', 'load failed');
      return null;
    }
  }

  // ==================== DATA MANAGEMENT ====================
  let allOrders = [];
  let allExpenses = [];

  async function loadAllData() {
    try {
      const data = await loadFromJSONBin();
      if (data) {
        allOrders = data.orders || [];
        allExpenses = data.expenses || [];
        console.log('✅ Loaded', allOrders.length, 'orders');
      } else {
        // Try localStorage fallback
        const localData = localStorage.getItem('hotel_orders_backup');
        if (localData) {
          const parsed = JSON.parse(localData);
          allOrders = parsed.orders || [];
          allExpenses = parsed.expenses || [];
          setSyncStatus('error', 'using backup');
        }
      }
    } catch (e) {
      console.error('Load error:', e);
    }
    renderAll();
  }

  // ==================== TRANSLATIONS ====================
  const translations = {
    en: {
      loginTitle: '🔐 THE MONOCHROME',
      loginSub: 'manager access',
      unlockBtn: 'unlock',
      managerLabel: 'manager',
      backBtn: '← menu',

      tabOrders: '📋 orders',
      tabExpenses: '💰 expenses',
      tabReports: '📈 reports',
      fromLabel: 'from',
      toLabel: 'to',
      statusLabel: 'status',
      allStatus: 'all',
      statusReceived: 'received',
      statusPreparing: 'preparing',
      statusDelivered: 'delivered',
      statusCompleted: 'completed',
      statusCancelled: 'cancelled',
      applyBtn: 'apply',
      resetBtn: 'reset',
      expenseDesc: 'description',
      expenseDescPlaceholder: 'e.g. staff wages',
      expenseAmount: 'amount ($)',
      expenseCategory: 'category',
      catWages: 'wages',
      catSupplies: 'supplies',
      catUtilities: 'utilities',
      catMaintenance: 'maintenance',
      catMarketing: 'marketing',
      catOther: 'other',
      expenseDate: 'date',
      addExpenseBtn: '+ add expense',
      periodLabel: 'period',
      periodToday: 'today',
      periodWeek: 'this week',
      periodMonth: 'this month',
      periodYear: 'this year',
      periodCustom: 'custom',
      generateBtn: 'generate report',
      recentActivity: '📌 recent activity',
      noOrders: '— no orders found —',
      noExpenses: '— no expenses logged —',
      noActivity: '— no activity —',
      totalLabel: 'TOTAL',
      revenue: 'Revenue',
      expenses: 'Expenses',
      profit: 'Net Profit',
      profitMargin: 'Profit Margin',
      totalOrders: 'Total Orders',
      totalItems: 'Total Items Sold',
      avgOrder: 'Average Order Value',
      taxLabel: 'tax'
    },
    am: {
      loginTitle: '🔐 ዘ ሞኖክሮም',
      loginSub: 'የሥራ አስኪያጅ መግቢያ',

  // ==================== DATA HELPERS ====================
  function getPaidOrders(orders) {
    return orders.filter(o => o.paymentStatus === 'paid');
  }

  function getDateStr(date) {
    return new Date(date).toISOString().split('T')[0];
  }

  function isToday(dateStr) {
    return dateStr === new Date().toISOString().split('T')[0];
  }

  function isThisWeek(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    weekStart.setHours(0,0,0,0);
    return d >= weekStart;
  }

  function isThisMonth(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }

  function isThisYear(dateStr) {
    return new Date(dateStr).getFullYear() === new Date().getFullYear();
  }

  function filterOrdersByPeriod(orders, period) {
    return orders.filter(o => {
      const d = getDateStr(o.createdAt);
      if (period === 'today') return isToday(d);
      if (period === 'week') return isThisWeek(d);
      if (period === 'month') return isThisMonth(d);
      if (period === 'year') return isThisYear(d);
      return true;
    });
  }

  function calculateTotals(orders) {
    const revenue = orders.reduce((s, o) => s + o.total, 0);
    const tax = orders.reduce((s, o) => s + (o.tax || 0), 0);
    const count = orders.length;
    const items = orders.reduce((s, o) => s + o.items.reduce((a, i) => a + i.quantity, 0), 0);
    const avg = count > 0 ? revenue / count : 0;
    return { revenue, tax, count, items, avg };
  }

  function renderTodayHero() {
    const paid = getPaidOrders(allOrders);
    const today = getDateStr(new Date());

    const todayOrders = paid.filter(o => getDateStr(o.createdAt) === today);

    const todayExpenses = allExpenses.filter(e => e.date === today).reduce((s, e) => s + e.amount, 0);

    const avgOrder = todayOrders.length > 0 ? todayRevenue / todayOrders.length : 0;

    document.getElementById('todayRevenueHero').textContent = `$${todayRevenue.toFixed(2)}`;
    document.getElementById('todayOrdersHero').textContent = `${todayOrders.length} orders`;

    document.getElementById('todayProfitHero').textContent = `$${todayProfit.toFixed(2)}`;

  function renderReport(period, from, to) {
    const paid = getPaidOrders(allOrders);

    let filteredOrders = [];
    let filteredExpenses = [];

    if (period === 'custom' && from && to) {
      filteredOrders = paid.filter(o => {
        const d = getDateStr(o.createdAt);
        return d >= from && d <= to;
      });
      filteredExpenses = allExpenses.filter(e => e.date >= from && e.date <= to);
    } else {
      filteredOrders = filterOrdersByPeriod(paid, period);
      filteredExpenses = allExpenses.filter(e => {
        if (period === 'today') return isToday(e.date);
        if (period === 'week') return isThisWeek(e.date);
        if (period === 'month') return isThisMonth(e.date);
        if (period === 'year') return isThisYear(e.date);
        return true;
      });
    }

    const totals = calculateTotals(filteredOrders);
    const totalExpenses = filteredExpenses.reduce((s, e) => s + e.amount, 0);
    const profit = totals.revenue - totalExpenses;
    const profitMargin = totals.revenue > 0 ? (profit / totals.revenue * 100) : 0;

    const daily = {};
    filteredOrders.forEach(o => {
      const d = getDateStr(o.createdAt);
      if (!daily[d]) daily[d] = { revenue: 0, count: 0 };
      daily[d].revenue += o.total;
      daily[d].count += 1;
    });

    const sortedDays = Object.keys(daily).sort();
    let dailyTable = '';
    if (sortedDays.length > 0) {
      dailyTable = `<div class="table-container">
        <table>
          <thead><tr><th>${getTranslation('expenseDate')}</th><th>${getTranslation('totalOrders')}</th><th>${getTranslation('revenue')}</th></tr></thead>

            `).join('')}
            <tr class="total-row"><td><strong>${getTranslation('totalLabel')}</strong></td><td><strong>${totals.count}</strong></td><td><strong>$${totals.revenue.toFixed(2)}</strong></td></tr>

        </table>
      </div>`;
    }

    document.getElementById('reportContent').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card gold"><div class="value">$${totals.revenue.toFixed(2)}</div><div class="label">${getTranslation('revenue')}</div></div>
        <div class="stat-card red"><div class="value">$${totalExpenses.toFixed(2)}</div><div class="label">${getTranslation('expenses')}</div></div>
        <div class="stat-card green"><div class="value">$${profit.toFixed(2)}</div><div class="label">${getTranslation('profit')}</div></div>
        <div class="stat-card"><div class="value">${profitMargin.toFixed(1)}%</div><div class="label">${getTranslation('profitMargin')}</div></div>
        <div class="stat-card"><div class="value">${totals.count}</div><div class="label">${getTranslation('totalOrders')}</div></div>
        <div class="stat-card"><div class="value">$${totals.avg.toFixed(2)}</div><div class="label">${getTranslation('avgOrder')}</div></div>
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>${getTranslation('expenseDesc')}</th><th>value</th></tr></thead>
          <tbody>
            <tr><td>${getTranslation('revenue')}</td><td>$${totals.revenue.toFixed(2)}</td></tr>
            <tr><td>${getTranslation('taxLabel')}</td><td>$${totals.tax.toFixed(2)}</td></tr>
            <tr><td>${getTranslation('expenses')}</td><td>$${totalExpenses.toFixed(2)}</td></tr>
            <tr><td><strong>${getTranslation('profit')}</strong></td><td><strong>$${profit.toFixed(2)}</strong></td></tr>
            <tr><td>${getTranslation('profitMargin')}</td><td><strong>${profitMargin.toFixed(1)}%</strong></td></tr>
            <tr><td>${getTranslation('totalOrders')}</td><td>${totals.count}</td></tr>
            <tr><td>${getTranslation('totalItems')}</td><td>${totals.items}</td></tr>
            <tr><td>${getTranslation('avgOrder')}</td><td>$${totals.avg.toFixed(2)}</td></tr>
          </tbody>
        </table>
      </div>
      ${dailyTable}
    `;
  }

  // ==================== RENDER ALL ====================
  function renderAll() {
    renderTodayHero();
    renderOverview();
    renderOrders('', '', 'all');
    renderExpenses();
    const period = document.getElementById('reportPeriod').value;
    if (period === 'custom') {
      renderReport('custom', document.getElementById('reportFrom').value, document.getElementById('reportTo').value);
    } else {
      renderReport(period);
    }
  }

  // ==================== EVENT LISTENERS ====================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');

      if (btn.dataset.tab === 'overview') { renderTodayHero(); renderOverview(); }
      if (btn.dataset.tab === 'orders') renderOrders('', '', 'all');
      if (btn.dataset.tab === 'expenses') renderExpenses();
      if (btn.dataset.tab === 'reports') {
        const period = document.getElementById('reportPeriod').value;
        if (period === 'custom') {
          renderReport('custom', document.getElementById('reportFrom').value, document.getElementById('reportTo').value);
        } else {
          renderReport(period);
        }
      }
    });
  });

  document.getElementById('filterOrdersBtn').addEventListener('click', () => {
    const from = document.getElementById('orderFrom').value;
    const to = document.getElementById('orderTo').value;
    const status = document.getElementById('orderStatusFilter').value;
    renderOrders(from, to, status);
  });

  document.getElementById('resetOrdersBtn').addEventListener('click', () => {
    document.getElementById('orderFrom').value = '';
    document.getElementById('orderTo').value = '';
    document.getElementById('orderStatusFilter').value = 'all';
    renderOrders('', '', 'all');
  });

  document.getElementById('addExpenseBtn').addEventListener('click', addExpense);

  document.getElementById('generateReportBtn').addEventListener('click', () => {
    const period = document.getElementById('reportPeriod').value;
    if (period === 'custom') {
      renderReport('custom', document.getElementById('reportFrom').value, document.getElementById('reportTo').value);
    } else {
      renderReport(period);
    }
  });

  document.getElementById('reportPeriod').addEventListener('change', (e) => {
    const show = e.target.value === 'custom';
    document.querySelectorAll('#reportFrom, #reportTo').forEach(el => {
      el.style.display = show ? 'block' : 'none';
      el.disabled = !show;
    });
  });
  document.getElementById('reportPeriod').dispatchEvent(new Event('change'));

  // ==================== INIT ====================
  async function initManager() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('expenseDate').value = today;
    document.getElementById('orderFrom').value = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
    document.getElementById('orderTo').value = today;
    document.getElementById('reportFrom').value = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
    document.getElementById('reportTo').value = today;

    await loadAllData();
    renderAll();

    // Auto-refresh every 10s
    setInterval(loadAllData, 10000);
  }

  // ==================== START ====================
  if (checkPassword()) {
    const savedLang = localStorage.getItem('manager_lang') || 'en';
    updateUILanguage(savedLang);
    initManager();
  }
</script>
</body>
</html>
